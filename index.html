<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補充メモ">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>補充メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ee;
  --bg2: #edeae3;
  --card: #ffffff;
  --text: #1a1a1a;
  --text2: #6b6760;
  --text3: #a8a49e;
  --border: rgba(0,0,0,0.08);
  --accent: #2d5a3d;
  --accent-light: #e8f0ea;
  --warn: #8a4a00;
  --warn-light: #fef3e2;
  --danger: #8b2020;
  --danger-light: #fdeaea;
  --safe: #1a6b3a;
  --safe-light: #e6f4eb;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412;
    --bg2: #1e1d1a;
    --card: #242320;
    --text: #f0ede6;
    --text2: #9b9690;
    --text3: #5c5a56;
    --border: rgba(255,255,255,0.08);
    --accent: #5a9e6e;
    --accent-light: #1a2e20;
    --warn: #d4a04a;
    --warn-light: #2a2010;
    --danger: #e06060;
    --danger-light: #2a1414;
    --safe: #5aae74;
    --safe-light: #142014;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  overscroll-behavior: none;
}
.app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  padding: calc(var(--safe-top) + 16px) 20px 12px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; }
.topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.topbar-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px;
  transition: transform 0.15s ease;
}
.icon-btn:active { transform: scale(0.92); }

.content { flex: 1; padding: 16px 16px calc(80px + var(--safe-bottom)); overflow-y: auto; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.sum-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 10px 12px; border: 1px solid var(--border);
  text-align: center;
}
.sum-num { font-size: 22px; font-weight: 700; }
.sum-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
.sum-card.ok .sum-num { color: var(--safe); }
.sum-card.soon .sum-num { color: var(--warn); }
.sum-card.now .sum-num { color: var(--danger); }

/* Filter chips */
.chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 5px 14px; border-radius: 100px;
  font-size: 13px; font-weight: 500;
  background: var(--card); border: 1px solid var(--border);
  cursor: pointer; color: var(--text2); transition: all 0.15s;
}
.chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Item cards */
.items { display: flex; flex-direction: column; gap: 10px; }
.item-card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 14px 16px;
  position: relative; overflow: hidden;
  animation: slideIn 0.25s ease both;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.item-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 2px 0 0 2px;
}
.item-card.ok::before { background: var(--safe); }
.item-card.soon::before { background: var(--warn); }
.item-card.now::before { background: var(--danger); }

.item-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.item-name { font-size: 16px; font-weight: 700; }
.item-cat { font-size: 11px; color: var(--text3); margin-top: 2px; }
.buy-btn {
  flex-shrink: 0; padding: 6px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: var(--accent-light); color: var(--accent);
  border: none; cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s;
  font-family: inherit;
}
.buy-btn:active { transform: scale(0.92); opacity: 0.8; }

.progress-track {
  height: 5px; background: var(--bg2);
  border-radius: 3px; margin-bottom: 10px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.ok .progress-fill { background: var(--safe); }
.soon .progress-fill { background: var(--warn); }
.now .progress-fill { background: var(--danger); }

.item-meta { display: flex; gap: 12px; }
.meta-item { font-size: 12px; color: var(--text2); }
.meta-item strong { font-weight: 500; color: var(--text); }
.status-pill {
  margin-left: auto; flex-shrink: 0;
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 100px; letter-spacing: 0.3px;
}
.ok .status-pill { background: var(--safe-light); color: var(--safe); }
.soon .status-pill { background: var(--warn-light); color: var(--warn); }
.now .status-pill { background: var(--danger-light); color: var(--danger); }

/* Bottom nav */
.bottomnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer; padding: 4px;
  font-family: inherit; color: var(--text3); transition: color 0.15s;
}
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 22px; }
.nav-label { font-size: 10px; font-weight: 500; }

/* Sheet (add / history) */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.sheet-overlay.open { opacity: 1; pointer-events: all; }
.sheet {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 430px;
  background: var(--card); border-radius: 24px 24px 0 0;
  padding: 0 0 calc(20px + var(--safe-bottom));
  z-index: 201; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  max-height: 90dvh; display: flex; flex-direction: column;
}
.sheet.open { transform: translateX(-50%) translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
.sheet-header { padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.sheet-title { font-size: 18px; font-weight: 700; }
.close-btn { background: var(--bg2); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: var(--text2); font-family: inherit; }
.sheet-body { padding: 16px 20px; overflow-y: auto; flex: 1; }

.field { margin-bottom: 16px; }
.field label { font-size: 13px; color: var(--text2); font-weight: 500; display: block; margin-bottom: 6px; }
.field input, .field select {
  width: 100%; padding: 12px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg2); color: var(--text);
  font-size: 16px; font-family: inherit; outline: none;
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.submit-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  transition: opacity 0.15s; margin-top: 4px;
}
.submit-btn:active { opacity: 0.8; }

/* History */
.history-group { margin-bottom: 20px; }
.history-date-label { font-size: 12px; color: var(--text3); font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.history-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.history-row:last-child { border-bottom: none; }
.h-name { font-size: 15px; font-weight: 500; }
.h-cat { font-size: 12px; color: var(--text3); }
.h-cycle { font-size: 12px; color: var(--text2); }

.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }

/* Toast */
.toast {
  position: fixed; bottom: calc(80px + var(--safe-bottom) + 12px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 10px 20px; border-radius: 100px;
  font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: all 0.3s ease; white-space: nowrap;
  z-index: 300;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Swipe delete */
.item-card { cursor: default; user-select: none; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>🛒 補充メモ</h1>
        <div class="topbar-sub" id="topbar-date"></div>
      </div>
      <button class="icon-btn" onclick="openHistory()" aria-label="履歴">📋</button>
    </div>
  </div>

  <div class="content">
    <div class="summary">
      <div class="sum-card ok"><div class="sum-num" id="cnt-ok">0</div><div class="sum-label">在庫あり</div></div>
      <div class="sum-card soon"><div class="sum-num" id="cnt-soon">0</div><div class="sum-label">もうすぐ</div></div>
      <div class="sum-card now"><div class="sum-num" id="cnt-now">0</div><div class="sum-label">補充して！</div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="items" id="items-list"></div>
  </div>

  <nav class="bottomnav">
    <button class="nav-btn active" onclick="setView('list')" id="nav-list">
      <span class="nav-icon">📦</span>
      <span class="nav-label">アイテム</span>
    </button>
    <button class="nav-btn" onclick="openAdd()" id="nav-add">
      <span class="nav-icon">＋</span>
      <span class="nav-label">記録する</span>
    </button>
    <button class="nav-btn" onclick="openHistory()" id="nav-hist">
      <span class="nav-icon">🕐</span>
      <span class="nav-label">履歴</span>
    </button>
  </nav>
</div>

<!-- Add Sheet -->
<div class="sheet-overlay" id="overlay-add" onclick="closeAdd()"></div>
<div class="sheet" id="sheet-add">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">購入を記録</div>
    <button class="close-btn" onclick="closeAdd()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field-row">
      <div class="field">
        <label>アイテム名</label>
        <input type="text" id="f-name" placeholder="例：洗剤" autocomplete="off">
      </div>
      <div class="field">
        <label>カテゴリ</label>
        <select id="f-cat">
          <option>日用品</option>
          <option>食品</option>
          <option>調味料</option>
          <option>衛生用品</option>
          <option>掃除用品</option>
          <option>その他</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>購入日</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <input type="text" id="f-note" placeholder="例：大容量サイズ" autocomplete="off">
    </div>
    <button class="submit-btn" onclick="recordPurchase()">✓ 記録する</button>
  </div>
</div>

<!-- History Sheet -->
<div class="sheet-overlay" id="overlay-hist" onclick="closeHistory()"></div>
<div class="sheet" id="sheet-hist">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">購入履歴</div>
    <button class="close-btn" onclick="closeHistory()">✕</button>
  </div>
  <div class="sheet-body" id="history-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'hozyuMemo_v2';
const today = new Date();

document.getElementById('topbar-date').textContent = today.toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric',weekday:'short'});
document.getElementById('f-date').valueAsDate = today;

function loadData() {
  try {
    const r = localStorage.getItem(STORAGE_KEY);
    return r ? JSON.parse(r) : getSample();
  } catch(e) { return getSample(); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function getSample() {
  const ago = n => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; };
  return [
    {id:1, name:'洗濯洗剤', cat:'掃除用品', purchases:[ago(60),ago(30)], note:''},
    {id:2, name:'醤油', cat:'調味料', purchases:[ago(90),ago(45),ago(5)], note:'大容量'},
    {id:3, name:'シャンプー', cat:'衛生用品', purchases:[ago(50),ago(10)], note:''},
    {id:4, name:'トイレットペーパー', cat:'日用品', purchases:[ago(40),ago(20),ago(2)], note:'12ロール'},
    {id:5, name:'みりん', cat:'調味料', purchases:[ago(120),ago(65)], note:''},
  ];
}

let data = loadData();
let activeFilter = 'すべて';

function avgCycle(purchases) {
  if (purchases.length < 2) return null;
  const s = [...purchases].sort();
  let t = 0;
  for (let i=1;i<s.length;i++) t += (new Date(s[i])-new Date(s[i-1]))/86400000;
  return Math.round(t/(s.length-1));
}
function daysSince(d) { return Math.round((today - new Date(d))/86400000); }
function getStatus(p) {
  if (p < 0.7) return 'ok';
  if (p < 0.9) return 'soon';
  return 'now';
}
function statusLabel(s) { return {ok:'在庫あり', soon:'もうすぐ', now:'補充して！'}[s]; }

function calcItem(item) {
  const last = item.purchases.length ? [...item.purchases].sort().pop() : null;
  const cycle = avgCycle(item.purchases);
  const since = last ? daysSince(last) : null;
  const progress = (cycle && since != null) ? Math.min(since/cycle, 1) : null;
  const status = progress != null ? getStatus(progress) : 'ok';
  const daysLeft = (cycle && since != null) ? Math.max(0, cycle-since) : null;
  const nextDate = (cycle && last) ? (() => {
    const d = new Date(last); d.setDate(d.getDate()+cycle);
    return d.toLocaleDateString('ja-JP',{month:'long',day:'numeric'});
  })() : null;
  return { last, cycle, since, progress, status, daysLeft, nextDate };
}

function renderChips() {
  const cats = ['すべて', ...new Set(data.map(d=>d.cat))];
  document.getElementById('chips').innerHTML = cats.map(c =>
    `<button class="chip${c===activeFilter?' active':''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}

function renderItems() {
  const filtered = activeFilter === 'すべて' ? data : data.filter(d=>d.cat===activeFilter);
  const sorted = [...filtered].sort((a,b) => {
    const sa = calcItem(a), sb = calcItem(b);
    const order = {now:0, soon:1, ok:2};
    return order[sa.status]-order[sb.status];
  });

  let ok=0, soon=0, now=0;
  data.forEach(item => {
    const {status} = calcItem(item);
    if (status==='ok') ok++;
    else if (status==='soon') soon++;
    else now++;
  });
  document.getElementById('cnt-ok').textContent = ok;
  document.getElementById('cnt-soon').textContent = soon;
  document.getElementById('cnt-now').textContent = now;

  if (!sorted.length) {
    document.getElementById('items-list').innerHTML = '<div class="empty">アイテムがありません<br>「記録する」から追加してみましょう</div>';
    return;
  }

  document.getElementById('items-list').innerHTML = sorted.map((item, idx) => {
    const {cycle, since, progress, status, daysLeft, nextDate} = calcItem(item);
    const lastStr = item.purchases.length ? new Date([...item.purchases].sort().pop()).toLocaleDateString('ja-JP',{month:'short',day:'numeric'}) : '—';
    return `<div class="item-card ${status}" style="animation-delay:${idx*0.04}s">
      <div class="item-top">
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-cat">${item.cat}${item.note?' · '+item.note:''}</div>
        </div>
        <button class="buy-btn" onclick="quickBuy(${item.id})">今日買った ✓</button>
      </div>
      ${progress != null ? `<div class="progress-track"><div class="progress-fill" style="width:${Math.round(progress*100)}%"></div></div>` : ''}
      <div class="item-meta">
        ${cycle ? `<div class="meta-item">サイクル <strong>${cycle}日</strong></div>` : ''}
        ${since != null ? `<div class="meta-item">前回 <strong>${lastStr}</strong></div>` : ''}
        ${nextDate ? `<div class="meta-item">次回 <strong>${nextDate}</strong></div>` : '<div class="meta-item" style="color:var(--text3)">2回記録でサイクル計算</div>'}
        <div class="status-pill">${statusLabel(status)}</div>
      </div>
    </div>`;
  }).join('');
}

function setFilter(cat) {
  activeFilter = cat;
  renderChips();
  renderItems();
}

function quickBuy(id) {
  const item = data.find(d=>d.id===id);
  if (!item) return;
  const todayStr = today.toISOString().split('T')[0];
  item.purchases.push(todayStr);
  save();
  renderItems();
  showToast('✓ '+item.name+' を記録しました！');
}

function openAdd() {
  document.getElementById('overlay-add').classList.add('open');
  document.getElementById('sheet-add').classList.add('open');
  document.getElementById('f-date').valueAsDate = today;
  setTimeout(()=>document.getElementById('f-name').focus(), 400);
}
function closeAdd() {
  document.getElementById('overlay-add').classList.remove('open');
  document.getElementById('sheet-add').classList.remove('open');
}

function recordPurchase() {
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const cat = document.getElementById('f-cat').value;
  const note = document.getElementById('f-note').value.trim();
  if (!name || !date) { showToast('⚠ アイテム名と日付を入力してください'); return; }
  let item = data.find(d=>d.name===name);
  if (item) {
    item.purchases.push(date);
  } else {
    data.push({id:Date.now(), name, cat, purchases:[date], note});
  }
  save();
  document.getElementById('f-name').value='';
  document.getElementById('f-note').value='';
  closeAdd();
  renderChips();
  renderItems();
  showToast('✓ '+name+' を記録しました！');
}

function openHistory() {
  const entries = [];
  data.forEach(item => {
    [...item.purchases].sort().reverse().forEach(date => {
      entries.push({name:item.name, cat:item.cat, date});
    });
  });
  entries.sort((a,b)=>b.date.localeCompare(a.date));

  const groups = {};
  entries.forEach(e => {
    const label = new Date(e.date).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    if (!groups[label]) groups[label]=[];
    groups[label].push(e);
  });

  const html = Object.entries(groups).slice(0,20).map(([label,rows])=>
    `<div class="history-group">
      <div class="history-date-label">${label}</div>
      ${rows.map(r=>`<div class="history-row">
        <div><div class="h-name">${r.name}</div><div class="h-cat">${r.cat}</div></div>
      </div>`).join('')}
    </div>`
  ).join('');

  document.getElementById('history-body').innerHTML = html || '<div class="empty">履歴がありません</div>';
  document.getElementById('overlay-hist').classList.add('open');
  document.getElementById('sheet-hist').classList.add('open');
}
function closeHistory() {
  document.getElementById('overlay-hist').classList.remove('open');
  document.getElementById('sheet-hist').classList.remove('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(()=>t.classList.remove('show'), 2500);
}

function setView(v) {}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

renderChips();
renderItems();
</script>
</body>
</html>
